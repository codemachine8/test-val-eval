[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Run tests in random order to expose order-dependent flakiness
# Uncomment to enable: addopts = -p pytest_randomly

# Generate JUnit XML report for UnfoldCI
junit_family = xunit2

# Show extra test summary info
addopts = -v --tb=short

# Markers
markers =
    flaky: mark test as known to be flaky
    slow: mark test as slow running
